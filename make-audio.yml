name: สร้างไฟล์เสียง

# กดรันเองจากแท็บ Actions
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: ดึงไฟล์ใน repo ลงมา
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ติดตั้ง gTTS
        run: pip install gTTS

      - name: สร้างไฟล์เสียง
        continue-on-error: true
        run: python make_audio.py

      - name: นับไฟล์ที่ได้
        if: always()
        run: |
          echo "bee: $(ls audio/bee/*.mp3 2>/dev/null | wc -l) ไฟล์"
          echo "sci: $(ls audio/sci/*.mp3 2>/dev/null | wc -l) ไฟล์"

      - name: บันทึกกลับเข้า repo
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add audio
          if git diff --staged --quiet; then
            echo "ไม่มีไฟล์ใหม่"
          else
            git commit -m "สร้างไฟล์เสียง $(date +%Y-%m-%d_%H:%M)"
            git pull --rebase
            git push
          fi
